[package]
name = "matemusic"
version = "0.1.0"
description = "MateMusic local Hi-Res music player"
edition = "2021"
rust-version = "1.77"
default-run = "matemusic"

[lib]
name = "matemusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
ringbuf = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
